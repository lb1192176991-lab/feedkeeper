name: Bug report
description: Create a report to help us fix an issue or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! Please check existing issues first to make sure it hasn't already been reported.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of what went wrong.
      placeholder: Tell us what you saw, what failed, or what unexpected behavior occurred.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can someone else reproduce this issue?
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. See error
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Deployment environment
      description: Where is your Feedkeeper instance running?
      options:
        - Docker / Docker Compose
        - Uberspace
        - Bare metal Linux (systemd / Node.js)
        - macOS / Local development
        - Other (please mention below)
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Environment details & logs
      description: Versions and relevant server/console logs or screenshots.
      placeholder: |
        - Feedkeeper version/commit:
        - Node.js version:
        - Browser / MCP client (if applicable):
        - Logs:
    validations:
      required: false
