<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-title" content="FeedKeeper" />
    <meta name="application-name" content="FeedKeeper" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("fk_theme");
          if (saved === "light" || saved === "dark") {
            document.documentElement.setAttribute("data-theme", saved);
          }
        } catch (e) {}
      })();
    </script>
    <title>FeedKeeper</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="Self-hosted RSS/Atom feed manager and remote MCP server for AI assistants." />
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FeedKeeper" />
    <meta property="og:title" content="FeedKeeper – RSS Reader & MCP Server" />
    <meta property="og:description" content="Self-hosted RSS/Atom feed manager and remote MCP server for AI assistants." />
    <meta property="og:image" content="/logo.svg" />
    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="FeedKeeper – RSS Reader & MCP Server" />
    <meta name="twitter:description" content="Self-hosted RSS/Atom feed manager and remote MCP server for AI assistants." />
    <meta name="twitter:image" content="/logo.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
