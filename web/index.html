<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-title" content="FeedKeeper" />
    <meta name="application-name" content="FeedKeeper" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script src="/theme-init.js"></script>
    <title>FeedKeeper</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/app-icon-180.png?v=2" />
    <meta name="description" content="Self-hosted RSS/Atom feed manager and remote MCP server for AI assistants." />
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FeedKeeper" />
    <meta property="og:title" content="FeedKeeper – RSS Reader & MCP Server" />
    <meta property="og:description" content="Self-hosted RSS/Atom feed manager and remote MCP server for AI assistants." />
    <meta property="og:image" content="/logo.svg" />
    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="FeedKeeper – RSS Reader & MCP Server" />
    <meta name="twitter:description" content="Self-hosted RSS/Atom feed manager and remote MCP server for AI assistants." />
    <meta name="twitter:image" content="/logo.svg" />
    <!-- Inline so the splash paints before any script or stylesheet loads -->
    <style>
      html { background: #f8fafc; }
      html[data-theme="dark"] { background: #0b0f17; }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) { background: #0b0f17; } }
      #splash { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: inherit; transition: opacity 0.3s ease; }
      #splash img { width: 72px; height: 72px; animation: splash-in 0.4s ease both; }
      #splash.splash-hidden { opacity: 0; pointer-events: none; }
      @keyframes splash-in { from { opacity: 0; transform: scale(0.92); } }
      @media (prefers-reduced-motion: reduce) { #splash, #splash img { transition: none; animation: none; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><img src="/logo.svg" alt="" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
